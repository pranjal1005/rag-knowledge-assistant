<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>RAG Knowledge Assistant</title>
<style>
  body { font-family: -apple-system, Segoe UI, Roboto, sans-serif; max-width: 720px; margin: 40px auto; padding: 0 16px; color: #1a1a1a; }
  h1 { font-size: 1.3rem; }
  #log { display: flex; flex-direction: column; gap: 16px; margin-bottom: 24px; }
  .msg { padding: 10px 14px; border-radius: 10px; line-height: 1.45; white-space: pre-wrap; }
  .user { background: #eef2ff; align-self: flex-end; }
  .assistant { background: #f4f4f5; }
  .sources { font-size: 0.8rem; color: #666; margin-top: 8px; }
  form { display: flex; gap: 8px; }
  input { flex: 1; padding: 10px; border: 1px solid #ccc; border-radius: 8px; }
  button { padding: 10px 16px; border: none; border-radius: 8px; background: #1a1a1a; color: white; cursor: pointer; }
  button:disabled { opacity: 0.5; cursor: default; }
</style>
</head>
<body>
  <h1>RAG Knowledge Assistant</h1>
  <div id="log"></div>
  <form id="form">
    <input id="input" type="text" placeholder="Ask a question about the indexed documents..." autocomplete="off" />
    <button id="submit" type="submit">Ask</button>
  </form>

  <script>
    const log = document.getElementById("log");
    const form = document.getElementById("form");
    const input = document.getElementById("input");
    const submitBtn = document.getElementById("submit");

    function addMessage(role, text) {
      const div = document.createElement("div");
      div.className = "msg " + role;
      div.textContent = text;
      log.appendChild(div);
      window.scrollTo(0, document.body.scrollHeight);
      return div;
    }

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      const question = input.value.trim();
      if (!question) return;

      addMessage("user", question);
      input.value = "";
      submitBtn.disabled = true;
      const pending = addMessage("assistant", "Thinking...");

      try {
        const res = await fetch("/ask", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ question }),
        });
        const data = await res.json();

        if (!res.ok) {
          pending.textContent = "Error: " + (data.detail || res.statusText);
        } else {
          pending.textContent = data.answer;
          if (data.sources && data.sources.length) {
            const src = document.createElement("div");
            src.className = "sources";
            src.textContent = "Sources: " + data.sources.map(s => s.source_title).join(", ");
            pending.appendChild(src);
          }
        }
      } catch (err) {
        pending.textContent = "Request failed: " + err;
      } finally {
        submitBtn.disabled = false;
      }
    });
  </script>
</body>
</html>
